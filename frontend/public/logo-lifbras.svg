    <!-- Palm curve -->
    <path d="M4 28 C2 22, 4 14, 10 10 C14 7, 18 9, 20 14 C22 19, 20 26, 16 30 C12 34, 6 32, 4 28 Z" fill="#0D9488"/>
    <!-- Dynamic gesture arcs representing signing movement -->
    <path d="M14 6 C17 3, 22 3, 25 7 C28 11, 27 17, 24 21" stroke="#14B8A6" stroke-width="3" stroke-linecap="round"/>
    <path d="M22 4 C26 2, 31 3, 33 8 C35 13, 33 18, 30 22" stroke="#0D9488" stroke-width="2.5" stroke-linecap="round" opacity="0.85"/>
  </g>

  <!-- Wordmark -->
  <text x="46" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="800" letter-spacing="-0.5">
    <tspan fill="#0D9488">Li</tspan><tspan fill="#0F172A">Fbras</tspan>
  </text>

  <!-- Tagline -->
  <text x="47" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="7" font-weight="700" letter-spacing="1.8" fill="#64748B">
